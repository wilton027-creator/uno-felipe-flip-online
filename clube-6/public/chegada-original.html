<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corrida da Chegada</title><style>body{font-family:system-ui;background:#111827;color:white;margin:0;padding:18px}main{max-width:880px;margin:auto}a{color:#b5d8ff}.panel{background:#243145;padding:18px;border-radius:18px;margin:12px 0}input,button{font:inherit;border:0;border-radius:9px;padding:12px;margin:5px}button{background:#facc15;color:#172033;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}.tile{min-height:57px;padding:4px;background:#38475c;border-radius:10px;font-size:13px;overflow-wrap:anywhere}.special{background:#6b4b2e}.players{font-size:16px;line-height:2}h1{font-size:clamp(24px,6vw,38px)}.desc{color:#d1d5db}</style><main><a href="ABRIR_JOGOS.html">← Voltar ao menu</a><h1>Corrida da Chegada</h1><p class="desc">Uma corrida rápida de dados até a casa 24. Casas especiais mudam seu caminho.</p><section class="panel"><label>Jogadores (de 2 a 8): <input type="number" id="qty" min="2" max="8" value="2" style="width:65px"></label><button id="start">Novo jogo</button><div id="names"></div></section><section class="panel"><div id="status">Configure a partida e clique em Novo jogo.</div><button id="roll" disabled>🎲 Lançar dado</button><div id="rollResult" style="font-size:22px"></div><div class="players" id="players"></div></section><div id="board" class="grid"></div></main><script>const END=24, NAME='Corrida da Chegada'; let players=[],turn=0,done=false;const el=id=>document.getElementById(id);let color=['#fde68a','#93c5fd','#fda4af','#86efac','#d8b4fe','#fdba74','#67e8f9','#f9a8d4'];const special= NAME==='Trilha com Dado'?{4:2,9:-3,15:3,21:-4,27:2}:NAME==='Corrida da Estrela'?{5:3,11:-2,17:4,23:-3,29:3,33:-2}:{3:2,7:-2,12:3,17:-3,21:2};function draw(){let s='';for(let i=1;i<=END;i++){let marker=players.map((p,j)=>p.pos===i?'<b style="color:'+color[j]+'">●'+(j+1)+'</b>':'').join(' ');s+='<div class="tile '+(special[i]?'special':'')+'"><b>'+i+'</b> '+(special[i]?'<small>'+ (special[i]>0?'⭐ +':'↩ ')+special[i]+'</small>':'')+'<br>'+marker+'</div>'}el('board').innerHTML=s;el('players').innerHTML=players.map((p,j)=>'<div style="color:'+color[j]+'">'+(j===turn&&!done?'➤ ':'')+(j+1)+'. '+p.name+': casa '+p.pos+'</div>').join('')}el('start').onclick=()=>{let n=Math.max(2,Math.min(8,Number(el('qty').value)||2));players=Array.from({length:n},(_,i)=>({name:'Jogador '+(i+1),pos:0}));let names=prompt('Digite os nomes dos jogadores separados por vírgula (opcional):','');if(names){names.split(',').slice(0,n).forEach((x,i)=>{if(x.trim())players[i].name=x.trim().replace(/[<>]/g,'')})}turn=0;done=false;el('roll').disabled=false;el('rollResult').textContent='';el('status').textContent='Vez de '+players[turn].name;draw()};el('roll').onclick=()=>{if(done)return;let p=players[turn],dice=1+Math.floor(Math.random()*6),next=Math.min(END,p.pos+dice),change=special[next]||0;p.pos=Math.min(END,Math.max(1,next+change));el('rollResult').textContent='🎲 '+dice+(change?' | Casa especial: '+(change>0?'+':'')+change:'');if(p.pos>=END){done=true;el('status').textContent='🏆 '+p.name+' venceu!';el('roll').disabled=true}else{turn=(turn+1)%players.length;el('status').textContent='Vez de '+players[turn].name}draw()};draw();</script></html>
