<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corrida dos Campeões • Desvendar</title><style>
:root{font-family:system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c1830;color:#fff;padding:15px}main{max-width:1100px;margin:auto}h1{color:#ffda75;margin:8px 0}p{color:#cbd8ef}.panel{background:#182b49;border:1px solid #526a93;border-radius:18px;padding:16px;margin:12px 0}label{display:inline-flex;align-items:center;gap:8px;margin:7px}input,select,button{font:inherit;border-radius:10px;padding:10px;border:1px solid #6e85ab;background:#243e62;color:white}button{cursor:pointer;font-weight:800}button.primary{background:#f5bd55;color:#152039}button:disabled{opacity:.4}.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}.names input{width:100%}.track{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}.cell{min-height:65px;background:#223b5d;border:2px solid #516b92;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px}.cell.goal{background:#665026;border-color:#ffd76d}.cell.special{background:#174c54}.tokens{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}.token{border-radius:100px;background:var(--c);color:#07162c;padding:3px 7px;font-size:12px;font-weight:900}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.turn{font-size:1.3rem;font-weight:900}.winner{font-size:1.8rem;color:#ffda75;text-align:center}.hidden{display:none}.score{display:flex;gap:10px;flex-wrap:wrap}.score span{padding:7px 12px;background:#294568;border-radius:10px}.die{font-size:3rem;min-width:60px;text-align:center}@media(min-width:700px){.track{grid-template-columns:repeat(10,minmax(0,1fr))}}@media(max-width:400px){.cell{min-height:57px;font-size:11px}}
</style></head><body><main><a href="/" style="color:#ffda75">← Clube dos 6 Jogos</a><h1>🏁 Corrida dos Campeões</h1><p>Jogo novo no estilo antigo • 2 a 6 jogadores • dado físico ou virtual • 40 casas</p>
<section class="panel" id="setup"><div class="row"><label>Jogadores <select id="count"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label><label>Dado <select id="mode"><option value="virtual">🎲 Virtual</option><option value="physical">✋ Físico</option></select></label></div><div id="names" class="names"></div><button class="primary" id="start">▶ Começar partida</button></section>
<section class="panel"><div class="row"><div class="turn" id="turn">Escolha os jogadores para começar.</div><div class="die" id="die">🎲</div><button class="primary" id="roll" disabled>🎲 Lançar dado</button><label id="physical" class="hidden">Valor <select id="value"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label><button id="apply" class="hidden">Confirmar dado</button><button id="again">↻ Novo jogo</button></div><p id="message">Casas ⭐ avançam 2; casas 🌀 voltam 2. Vence quem chegar à casa 40!</p><div class="winner" id="winner" aria-live="polite"></div></section>
<section class="panel"><div id="track" class="track"></div></section><section class="panel"><h2>🏆 Placar</h2><div class="score" id="score"></div></section>
</main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),colors=['#ffcb68','#80d7ff','#ff9ac1','#adf2a0','#c4a6ff','#ffa976'];let players=[],turn=0,finished=false,scores=Array(6).fill(0);const stars=[5,14,23,32],swirls=[9,18,27,36];
function setupNames(){let n=Number($('count').value);$('names').innerHTML='';for(let i=0;i<n;i++){let inp=document.createElement('input');inp.id='name'+i;inp.maxLength=22;inp.placeholder='Jogador '+(i+1);inp.value='Jogador '+(i+1);$('names').append(inp)}}function render(){const board=$('track');board.innerHTML='';for(let n=1;n<=40;n++){let cell=document.createElement('div');cell.className='cell'+(n===40?' goal':stars.includes(n)?' special':'');let label=document.createElement('strong');label.textContent=n===40?'🏆 40':stars.includes(n)?'⭐ '+n:swirls.includes(n)?'🌀 '+n:String(n);cell.append(label);let group=document.createElement('div');group.className='tokens';players.forEach((p,i)=>{if(p.pos===n){let t=document.createElement('span');t.className='token';t.style.setProperty('--c',colors[i]);t.textContent=p.name.slice(0,7);group.append(t)}});cell.append(group);board.append(cell)}$('score').innerHTML='';players.forEach((p,i)=>{let s=document.createElement('span');s.textContent=p.name+': '+scores[i]+' 🏆 | casa '+p.pos;$('score').append(s)});$('turn').textContent=players.length?(finished?'Partida encerrada':'Vez de '+players[turn].name):'Escolha os jogadores para começar.';$('roll').disabled=!players.length||finished||$('mode').value==='physical';$('physical').classList.toggle('hidden',$('mode').value!=='physical');$('apply').classList.toggle('hidden',$('mode').value!=='physical');$('apply').disabled=!players.length||finished}
function play(d){if(finished||!players.length)return;let p=players[turn];let from=p.pos;p.pos=Math.min(40,p.pos+d);let effect='';if(p.pos<40&&stars.includes(p.pos)){p.pos=Math.min(40,p.pos+2);effect=' ⭐ Avançou mais 2!'}else if(swirls.includes(p.pos)){p.pos=Math.max(1,p.pos-2);effect=' 🌀 Voltou 2!'}$('die').textContent=['','⚀','⚁','⚂','⚃','⚄','⚅'][d];$('message').textContent=p.name+' tirou '+d+' e saiu da casa '+from+' para a '+p.pos+'.'+effect;if(p.pos===40){finished=true;scores[turn]++;$('winner').textContent='🏆 '+p.name+' venceu a partida!'}else turn=(turn+1)%players.length;render()}
$('count').onchange=setupNames;$('mode').onchange=render;$('start').onclick=()=>{players=Array.from({length:Number($('count').value)},(_,i)=>({name:$('name'+i).value.trim()||'Jogador '+(i+1),pos:0}));scores=Array(6).fill(0);turn=0;finished=false;$('winner').textContent='';$('die').textContent='🎲';$('message').textContent='Partida iniciada! Boa sorte!';render()};$('roll').onclick=()=>play(Math.floor(Math.random()*6)+1);$('apply').onclick=()=>play(Number($('value').value));$('again').onclick=()=>{players=[];finished=false;$('winner').textContent='';$('die').textContent='🎲';$('message').textContent='Configure e comece uma nova partida.';render()};setupNames();render()})();
</script></body></html>
