<title>Dados em Jogo • Dois jogos para se divertir</title>
<style>
:root{--bg:#101427;--panel:#1a2039;--panel2:#222a46;--edge:#343d5b;--txt:#f6f7fc;--muted:#b2bfd1;--lime:#d4ff61;--violet:#a992ff;--orange:#ffb45f;--coral:#ff7881;--blue:#77c8ff;--outline:rgba(255,255,255,.15)}
*{box-sizing:border-box}html{height:100%;scroll-behavior:smooth}body{font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;min-height:100vh;color:var(--txt);background:radial-gradient(ellipse 46% 33% at 7% -12%,#6c469e57,transparent 75%),radial-gradient(ellipse 60% 38% at 108% 4%,#2559a550,transparent 70%),var(--bg);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit}button{cursor:pointer;transition:transform .14s ease,background .14s ease,opacity .14s ease}button:active{transform:scale(.97)}button:disabled{cursor:not-allowed;opacity:.47;transform:none}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--lime);outline-offset:3px}button{border:0}main{max-width:1060px;margin:0 auto;padding:20px 18px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:30px}.logo{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:-.5px;font-size:20px}.logo-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;color:#101427;background:var(--lime);font-size:23px;transform:rotate(-9deg)}.mini{font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:800;color:var(--muted)}.badge{border:1px solid var(--edge);padding:8px 12px;border-radius:999px;font-size:12px;font-weight:800;color:var(--lime);background:#212940}.hero{margin:25px 0 28px}.hero h1{font-size:clamp(38px,7.8vw,70px);letter-spacing:-3px;line-height:1.02;margin:8px 0 16px;max-width:840px}.hero h1 em{color:var(--lime);font-style:normal}.hero p{color:var(--muted);font-size:clamp(15px,2.3vw,19px);max-width:690px;line-height:1.55}.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.game-card{background:linear-gradient(155deg,#2b3452,#1b223c 70%);border:1px solid #435073;border-radius:24px;padding:20px;min-height:376px;display:flex;flex-direction:column;gap:13px;box-shadow:0 20px 45px #05081945;position:relative;overflow:hidden}.game-card:before{content:'';position:absolute;pointer-events:none;width:270px;height:260px;right:-100px;top:-115px;border-radius:50%;background:#9a80ff20}.game-card.alt:before{background:#d4ff6120}.card-num{font-weight:900;font-size:12px;color:var(--muted);letter-spacing:1.9px}.game-card h2{margin:0;font-size:29px;line-height:1.13;letter-spacing:-1px}.game-card p{color:var(--muted);font-size:14px;line-height:1.6;margin:0}.pillrow{display:flex;flex-wrap:wrap;gap:7px}.tag{border-radius:99px;padding:7px 9px;background:#ffffff12;color:#d7e1ef;font-size:11px;font-weight:800}.primary{background:var(--lime);color:#14192a;font-weight:950;padding:14px 18px;border-radius:13px;min-height:48px;box-shadow:0 6px 0 #a1c74544}.secondary{background:#ffffff13;border:1px solid var(--outline);color:#fff;border-radius:12px;padding:12px 14px;font-weight:800}.ghost{background:transparent;color:var(--muted);padding:11px 14px;font-weight:800}.card-go{margin-top:auto}.preview{height:116px;display:flex;gap:11px;justify-content:center;align-items:center;position:relative}.prev-grid{background:#11182b;border:2px solid #536281;padding:7px;border-radius:11px;display:grid;grid-template-columns:repeat(3,25px);grid-template-rows:repeat(3,25px);gap:3px;transform:rotate(-7deg)}.prev-grid:nth-child(2){transform:rotate(6deg)}.prev-grid span{border-radius:4px;background:#394562;display:grid;place-items:center;font-weight:900;font-size:19px;color:var(--orange)}.prev-grid:nth-child(2) span{color:var(--blue)}.prev-list{display:flex;gap:13px;align-items:center;transform:rotate(-4deg)}.prev-list .column{background:#141c31;border:1px solid #546581;padding:9px 9px 5px;border-radius:9px;display:flex;flex-direction:column;gap:4px}.prev-list b{height:14px;font-size:10px;color:var(--lime);text-align:center}.prev-list i{font-size:13px;font-weight:900;font-style:normal;width:25px;height:17px;text-align:center;border-radius:5px;background:#303c57;color:#fcffff}.prev-list i.ticked{background:var(--lime);color:#17202b}.foot{text-align:center;margin-top:32px;font-size:12px;color:#7f90a9}.back{color:var(--muted);padding:7px 0;background:transparent;font-weight:850;display:flex;align-items:center;gap:7px}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 19px;flex-wrap:wrap}.game-title h1{font-size:clamp(25px,5vw,39px);letter-spacing:-1.5px;margin:3px 0}.desc{font-size:14px;color:var(--muted);line-height:1.5;margin:0}.game-shell{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start}.box{background:#192039ee;border:1px solid #3d4866;border-radius:19px;padding:18px;box-shadow:0 14px 30px #070b1b48}.section-title{font-size:12px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 13px}.turn{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:14px;background:#ffffff0c;border:1px solid var(--edge);margin-bottom:14px}.avatar{width:43px;height:43px;flex-shrink:0;border-radius:13px;background:var(--person);color:#121627;font-size:22px;font-weight:950;display:grid;place-items:center}.turn .who{font-weight:950;font-size:17px;overflow-wrap:anywhere}.turn .sub{font-size:12px;color:var(--muted)}.dieline{display:grid;place-items:center;gap:10px;padding:5px 0 14px}.die{width:116px;height:116px;border-radius:24px;background:#fdfdfa;display:grid;place-items:center;color:#161a2f;font-size:91px;line-height:1;box-shadow:0 12px 0 #a5acd2,0 18px 28px #050a1a77;user-select:none}.die.shaking{animation:shake .48s ease-in-out}@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-15deg) translateX(-7px)}40%{transform:rotate(11deg) translateX(6px)}65%{transform:rotate(-9deg)}85%{transform:rotate(8deg)}}.die-label{font-size:12px;font-weight:900;color:var(--muted);min-height:16px}.actions{display:grid;gap:10px}.actions .primary,.actions .secondary{width:100%}.msg{text-align:center;font-size:14px;min-height:40px;line-height:1.5;color:#dce8fb;margin:5px 0 0}.choose{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}.choose button{padding:10px 0;font-weight:900;color:#fff;background:#313b58;border:1px solid #56617d;border-radius:10px}.choose button:hover{background:#47567a}.board-wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.board-card{background:#252d48;padding:12px;border-radius:17px;border:1px solid #435170;min-width:0}.board-card.winner{border-color:var(--lime);box-shadow:0 0 0 2px #d4ff6155}.board-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;gap:4px}.board-heading strong{font-size:12px}.board-heading span{font-size:10px;color:var(--muted)}.col-labels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:4px 0 8px}.col-labels span{text-align:center;font-size:17px;font-weight:950;color:var(--lime)}.tic-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.tic-cell{background:#11182b;border:1px solid #4a5676;border-radius:10px;aspect-ratio:1;min-width:0;display:grid;place-items:center;font-size:clamp(25px,4vw,44px);font-weight:950;color:#fff}.tic-cell[data-v="X"]{color:var(--orange)}.tic-cell[data-v="O"]{color:var(--blue)}.tic-cell.legal{background:#384c4b;border-color:#d4ff61;box-shadow:inset 0 0 0 1px #d4ff6158;animation:glow 1.3s infinite alternate}.tic-cell.mark-win{background:#51612d;border-color:var(--lime)}@keyframes glow{from{box-shadow:inset 0 0 0 1px #d4ff6144}to{box-shadow:inset 0 0 0 2px #d4ff61a8}}.score-row{display:flex;gap:10px;margin-bottom:15px}.score{flex:1;min-width:0;background:#252d49;border-radius:13px;padding:12px;display:flex;align-items:center;gap:9px;border:1px solid #435170}.score b{font-size:27px;margin-left:auto;font-variant-numeric:tabular-nums}.score span{font-size:12px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score .marker{font-size:23px;font-weight:950;color:var(--pc)}.legend{margin-top:15px;border-top:1px solid var(--edge);padding-top:12px;color:var(--muted);font-size:13px;line-height:1.6}.fbar{margin-top:15px;display:flex;gap:9px;flex-wrap:wrap}.fbar button{flex:1}.winner-banner{margin-bottom:15px;background:#d4ff61;color:#1b2234;padding:15px;border-radius:15px;text-align:center;font-size:18px;font-weight:950;box-shadow:0 8px 0 #76962f}.players-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.player-card{background:#252e49;border:1px solid #42516f;border-radius:16px;padding:13px;min-width:0}.player-card.active{border-color:var(--lime);box-shadow:inset 0 0 0 1px #d4ff613a;background:#2f3c48}.player-card.completed{border-color:#8ece77}.phead{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:9px}.phead span{font-weight:900;min-width:0;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.phead b{font-size:12px;color:var(--muted)}.num-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}.num{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:15px;border:1px solid #59627b;background:#131c32;color:#bac8e1;position:relative}.num.done{background:var(--pc);color:#142036;border-color:var(--pc)}.num.done:after{content:'✓';font-size:9px;position:absolute;right:2px;top:0}.progress{height:7px;background:#141a2c;border-radius:99px;overflow:hidden;margin-top:11px}.progress i{display:block;background:var(--pc);height:100%;border-radius:inherit;transition:width .3s}.history{display:flex;gap:6px;flex-wrap:wrap}.history span{font-size:12px;border:1px solid #47526e;border-radius:99px;padding:5px 9px;color:#e7edfa}.dialog-back{position:fixed;inset:0;background:#060918dd;z-index:20;display:grid;place-items:center;padding:14px;overflow-y:auto;backdrop-filter:blur(8px)}.dialog{max-width:530px;width:100%;background:#202a46;border:1px solid #596380;border-radius:25px;padding:24px;box-shadow:0 24px 70px #0009}.dialog h2{margin:5px 0 9px;font-size:29px;letter-spacing:-1px}.dialog p{font-size:14px;color:var(--muted);line-height:1.6}.field{display:block;margin:14px 0}.field>span{display:block;color:#c3cfe1;font-size:12px;font-weight:850;margin-bottom:7px}.field input,.field select{background:#12192e;color:white;border:1px solid #596582;padding:12px;border-radius:10px;width:100%;min-height:44px}.name-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.dialog-actions{display:flex;gap:10px;margin-top:16px}.dialog-actions>*{flex:1}.radio-row{display:flex;gap:8px}.radio-row button{flex:1;background:#151d34;color:#b5c4df;border:1px solid #455474;padding:11px 8px;border-radius:12px;font-size:13px;font-weight:900}.radio-row button.selected{background:#d4ff61;color:#172034;border-color:#d4ff61}.hint{font-size:12px;color:#9eacc3}.hidden{display:none!important}.confetti{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:10}.confetti i{position:absolute;top:-15px;width:10px;height:16px;background:var(--c);animation:fall 2.4s linear forwards;left:var(--l);animation-delay:var(--d);transform:rotate(var(--r))}@keyframes fall{to{transform:translate3d(10vw,110vh,0) rotate(720deg);opacity:0}}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:750px){.game-shell{grid-template-columns:1fr}.games{grid-template-columns:1fr}.game-card{min-height:300px}.hero h1{letter-spacing:-1.9px}.box{padding:14px}.game-shell aside{order:-1}.game-shell aside .dieline{padding:0 0 7px;gap:3px}.game-shell aside .die{width:75px;height:75px;border-radius:15px;font-size:61px;box-shadow:0 6px 0 #a5acd2,0 8px 12px #0008}.game-shell aside .turn{margin-bottom:7px}.game-shell aside .actions{max-width:440px;margin:0 auto}.game-shell aside .msg{min-height:0;margin-top:9px}.players-grid{grid-template-columns:1fr 1fr}.board-wrap{gap:9px}.board-card{padding:9px}.board-heading strong{font-size:11px}.col-labels span{font-size:15px}}
@media(max-width:440px){main{padding:16px 11px 36px}.game-card{padding:17px}.board-wrap{gap:7px}.board-card{padding:7px}.tic-grid{gap:4px}.tic-cell{border-radius:6px;font-size:30px}.board-heading span{font-size:9px}.players-grid{grid-template-columns:1fr}.num{font-size:20px;aspect-ratio:1.15}.name-grid{grid-template-columns:1fr}.dialog{padding:17px}.logo{font-size:17px}.badge{font-size:10px;padding:7px}.score b{font-size:21px}.score{padding:8px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<body><main id="app"></main><div id="confetti" class="confetti" aria-hidden="true"></div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), app=$('#app');
const faces=['⚀','⚁','⚂','⚃','⚄','⚅'];
const colors=['#ffb45f','#77c8ff','#be9aff','#ff898a','#d4ff61','#ffaaf0','#7de4c9','#efc27a'];
const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const defaultState=()=>({page:'home',type:1,dieType:'virtual',playerCount:2,players:['Jogador 1','Jogador 2'],current:0,phase:'roll',roll:null,boards:[Array(9).fill(''),Array(9).fill('')],marks:[],scores:[0,0],winner:null,winLine:null,history:[],message:'Role o dado para começar.',setup:false,setupType:1});
let state=defaultState(),locked=false;
try{const stored=localStorage.getItem('dados-em-jogo-v1');if(stored){const candidate=JSON.parse(stored);if(candidate&&Array.isArray(candidate.players)&&[1,2].includes(candidate.type)&&['home','play'].includes(candidate.page))state={...defaultState(),...candidate,setup:false};}}catch(e){}
function save(){try{const {setup,...rest}=state;localStorage.setItem('dados-em-jogo-v1',JSON.stringify(rest));}catch(e){}}
function header(){return `<header class="top"><div class="logo"><span class="logo-icon">⚄</span><span>Dados em Jogo</span></div><span class="badge">2 JOGOS • OFFLINE</span></header>`}
function preview1(){return `<div class="preview"><div class="prev-grid">${['X','','O','O','X','X','X','','O'].map(v=>`<span>${v}</span>`).join('')}</div><div class="prev-grid">${['X','O','X','X','O','O','X','','O'].map(v=>`<span>${v}</span>`).join('')}</div></div>`}
function preview2(){return `<div class="preview"><div class="prev-list">${[0,1,2,3].map((j)=>`<div class="column"><b>J${j+1}</b>${[1,2,3,4,5,6].map(n=>`<i class="${(n+j)%3?'ticked':''}">${n}</i>`).join('')}</div>`).join('')}</div></div>`}
function home(){return `${header()}<section class="hero"><div class="mini">DO PAPEL PARA A TELA</div><h1>Dois jogos.<br><em>Um dado.</em><br>Diversão sem fim.</h1><p>Inspirados nos desenhos originais: jogue com seus amigos no mesmo celular, usando o dado na tela ou um dado de verdade.</p></section><div class="games"><article class="game-card"><div class="card-num">JOGO 01 / ESTRATÉGIA</div>${preview1()}<h2>Velha dos Dados</h2><p>Dois tabuleiros! O dado determina em qual coluna você pode marcar X ou O. Forme uma linha de três antes do adversário.</p><div class="pillrow"><span class="tag">2 jogadores</span><span class="tag">2 tabuleiros</span><span class="tag">Dado 1 a 6</span></div><button class="primary card-go" data-act="setup" data-type="1">JOGAR VELHA DOS DADOS →</button></article><article class="game-card alt"><div class="card-num">JOGO 02 / CORRIDA</div>${preview2()}<h2>Corrida do 1 ao 6</h2><p>Cada jogador tem seis números para completar. Role o dado e marque o número sorteado na sua coluna. Quem preencher os seis primeiro vence!</p><div class="pillrow"><span class="tag">2 a 8 jogadores</span><span class="tag">Sorte + disputa</span><span class="tag">Dado 1 a 6</span></div><button class="primary card-go" data-act="setup" data-type="2">JOGAR CORRIDA DOS NÚMEROS →</button></article></div><p class="foot">Funciona offline • Não exige cadastro • Compartilhe o celular entre os jogadores</p>`}
function setupModal(){const type=state.setupType;const count=type===1?2:state.playerCount;const names=Array.from({length:count},(_,i)=>state.players[i]||`Jogador ${i+1}`);return `<div class="dialog-back" role="presentation"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogtitle"><div class="mini">PREPARAR A PARTIDA</div><h2 id="dialogtitle">${type===1?'Velha dos Dados':'Corrida do 1 ao 6'}</h2><p>${type===1?'Cada pessoa joga com X ou O. O dado escolhe a coluna.':'Cada pessoa marca sua própria lista de números, de 1 a 6.'}</p>${type===2?`<label class="field"><span>QUANTIDADE DE JOGADORES</span><select id="playercount">${[2,3,4,5,6,7,8].map(v=>`<option value="${v}" ${count===v?'selected':''}>${v} jogadores</option>`).join('')}</select></label>`:''}<span class="section-title">NOMES DOS JOGADORES</span><div class="name-grid">${names.map((n,i)=>`<label class="field"><span>JOGADOR ${i+1} ${type===1?`· ${i===0?'X':'O'}`:''}</span><input class="name-entry" maxlength="20" data-player="${i}" value="${esc(n)}" autocomplete="off" placeholder="Jogador ${i+1}"></label>`).join('')}</div><p class="section-title">COMO VÃO ROLAR O DADO?</p><div class="radio-row"><button type="button" data-act="die-mode" data-mode="virtual" class="${state.dieType==='virtual'?'selected':''}">🎲 Dado na tela</button><button type="button" data-act="die-mode" data-mode="physical" class="${state.dieType==='physical'?'selected':''}">✋ Dado físico</button></div><p class="hint">No modo físico, jogue seu dado na mesa e informe o número que saiu.</p><div class="dialog-actions"><button class="secondary" data-act="close-setup">Voltar</button><button class="primary" data-act="start">COMEÇAR →</button></div></div></div>`}
function play(){const is1=state.type===1;return `${header()}<div class="bar"><div><button class="back" data-act="home">← Outros jogos</button><div class="game-title"><div class="mini">JOGO 0${state.type}</div><h1>${is1?'Velha dos Dados':'Corrida do 1 ao 6'}</h1><p class="desc">${is1?'Dado 1, 2 ou 3: tabuleiro A. Dado 4, 5 ou 6: tabuleiro B.':'Marque o resultado do dado na lista do jogador da vez.'}</p></div></div><button class="secondary" data-act="new-round">↻ Nova rodada</button></div>${state.winner!==null?`<div class="winner-banner" role="status">🏆 ${state.winner===-1?'EMPATE!':esc(state.players[state.winner])+' VENCEU!'} ${state.type===1&&state.winner!==-1?`· TABULEIRO ${state.winLine?.board===0?'A':'B'}`:''}</div>`:''}<div class="game-shell"><section class="box">${is1?ticBody():raceBody()}</section><aside class="box">${controls()}</aside></div><div class="fbar"><button class="secondary" data-act="rules">? Como jogar</button><button class="secondary" data-act="setup-current">⚙ Jogadores e dado</button>${state.winner!==null?`<button class="primary" data-act="new-round">PRÓXIMA RODADA →</button>`:''}</div><p class="foot">${esc(state.players.join(' • '))} · Dados em Jogo</p>`}
function ticBody(){const p=state.current;let winSet=state.winLine?new Set(state.winLine.cells):new Set();let boards=state.boards.map((board,bi)=>{const isSelected=state.roll!==null&&(state.roll<=3?0:1)===bi;const targetCol=state.roll===null?-1:(state.roll-1)%3;return `<div class="board-card ${state.winLine?.board===bi?'winner':''}"><div class="board-heading"><strong>TABULEIRO ${bi===0?'A':'B'}</strong><span>${bi===0?'Dados 1–3':'Dados 4–6'}</span></div><div class="col-labels">${[0,1,2].map(c=>`<span>${bi*3+c+1}</span>`).join('')}</div><div class="tic-grid">${board.map((val,i)=>{const can=state.phase==='place'&&isSelected&&i%3===targetCol&&!val;return `<button type="button" class="tic-cell ${can?'legal':''} ${state.winLine?.board===bi&&winSet.has(i)?'mark-win':''}" data-act="cell" data-b="${bi}" data-i="${i}" data-v="${val}" ${can?'':'disabled'} aria-label="Tabuleiro ${bi===0?'A':'B'}, linha ${Math.floor(i/3)+1}, coluna ${i%3+1}, ${val||'vazio'}">${val||'&nbsp;'}</button>`}).join('')}</div></div>`});return `<p class="section-title">DOIS TABULEIROS / UM DADO</p><div class="score-row">${state.players.map((name,i)=>`<div class="score"><span class="marker" style="--pc:${colors[i]}">${i===0?'X':'O'}</span><span title="${esc(name)}">${esc(name)}</span><b>${state.scores[i]||0}</b></div>`).join('')}</div><div class="board-wrap">${boards.join('')}</div><div class="legend">🎯 Para ganhar, alinhe <strong>3 símbolos iguais</strong> na horizontal, vertical ou diagonal em qualquer tabuleiro. O número sorteado determina a coluna disponível.</div>`}
function raceBody(){const list=state.players.map((name,i)=>{const marks=state.marks[i]||Array(6).fill(false);const total=marks.filter(Boolean).length;return `<div class="player-card ${state.current===i&&state.winner===null?'active':''} ${total===6?'completed':''}" style="--pc:${colors[i%colors.length]}"><div class="phead"><span>${state.current===i&&state.winner===null?'➤ ':''}${esc(name)}</span><b>${total}/6</b></div><div class="num-row">${marks.map((done,j)=>`<div class="num ${done?'done':''}" aria-label="${j+1}: ${done?'marcado':'pendente'}">${j+1}</div>`).join('')}</div><div class="progress"><i style="width:${total*100/6}%"></i></div></div>`}).join('');return `<p class="section-title">PRIMEIRO A COMPLETAR OS SEIS NÚMEROS VENCE</p><div class="players-grid">${list}</div><div class="legend">🎲 Cada jogador tem uma lista de 1 a 6. Saiu um número novo? Ele é marcado automaticamente. Saiu repetido? A vez passa sem nova marcação.${state.history.length?`<p><strong>Últimas jogadas:</strong></p><div class="history">${state.history.slice(0,12).map(x=>`<span title="${esc(state.players[x.player])}">${esc(state.players[x.player])}: ${faces[x.roll-1]}</span>`).join('')}</div>`:''}</div>`}
function controls(){const p=state.current;const playerName=state.players[p]||'Jogador';const is1=state.type===1;const label=state.roll===null?'Aguardando dado':`Saiu ${state.roll}!`;let button='';if(state.phase==='roll'){button=state.dieType==='virtual'?`<button class="primary" data-act="roll">🎲 ROLAR O DADO</button>`:`<div class="section-title" style="text-align:center;margin-bottom:0">INFORME O RESULTADO</div><div class="choose">${[1,2,3,4,5,6].map(n=>`<button data-act="manual" data-n="${n}">${n}</button>`).join('')}</div>`}else if(state.phase==='place'){button=`<button class="secondary" disabled>👆 Marque uma casa iluminada</button>`}else if(state.phase==='next'){button=`<button class="primary" data-act="next">PASSAR A VEZ →</button>`}else if(state.phase==='won'){button=`<button class="primary" data-act="new-round">JOGAR OUTRA RODADA →</button>`}
return `<p class="section-title">${state.phase==='won'?'FIM DA RODADA':'VEZ DE JOGAR'}</p><div class="turn"><div class="avatar" style="--person:${colors[p%colors.length]}">${is1?(p===0?'X':'O'):(p+1)}</div><div><div class="who">${esc(playerName)}</div><div class="sub">${state.phase==='roll'?'Pode lançar o dado':state.phase==='place'?'Escolha onde marcar':state.phase==='next'?'Jogada concluída':'Rodada finalizada'}</div></div></div><div class="dieline"><div id="dice" class="die" role="img" aria-label="${state.roll===null?'Dado não lançado':`Dado mostrando ${state.roll}`}">${state.roll===null?'⚄':faces[state.roll-1]}</div><div class="die-label">${label}</div></div><div class="actions">${button}</div><p id="game-message" class="msg" aria-live="polite">${esc(state.message)}</p>${state.dieType==='physical'?`<p class="hint" style="text-align:center;margin-bottom:0">Modo dado físico ativado</p>`:''}`}
function render(){app.innerHTML=(state.page==='home'?home():play())+(state.setup?setupModal():'');save()}
function showSetup(type){state.setup=true;state.setupType=type;if(type===1){state.playerCount=2;if(state.players.length<2)state.players=['Jogador 1','Jogador 2'];}render()}
function readNames(){const nodes=[...document.querySelectorAll('.name-entry')];if(nodes.length)state.players=nodes.map((n,i)=>n.value.trim().slice(0,20)||`Jogador ${i+1}`)}
function start(){readNames();state.type=state.setupType;state.playerCount=state.type===1?2:state.playerCount;state.players=state.players.slice(0,state.playerCount);if(state.players.length<state.playerCount)state.players.push(...Array.from({length:state.playerCount-state.players.length},(_,i)=>`Jogador ${state.players.length+i+1}`));state.scores=state.players.map(()=>0);state.page='play';state.setup=false;resetRound(true);}
function resetRound(starting=false){state.phase='roll';state.current=0;state.roll=null;state.boards=[Array(9).fill(''),Array(9).fill('')];state.marks=state.players.map(()=>Array(6).fill(false));state.history=[];state.winner=null;state.winLine=null;state.message='É a vez de '+state.players[0]+'. Role o dado!';render();if(!starting)window.scrollTo({top:0,behavior:'smooth'})}
function roll(){if(state.phase!=='roll'||locked)return;locked=true;const btn=document.querySelector('[data-act="roll"]');if(btn)btn.disabled=true;const d=$('#dice');if(d)d.classList.add('shaking');let n=1+Math.floor(Math.random()*6);setTimeout(()=>{locked=false;applyDie(n)},450)}
function applyDie(n){if(state.phase!=='roll'||!Number.isInteger(n)||n<1||n>6)return;state.roll=n;state.history.unshift({player:state.current,roll:n});state.history=state.history.slice(0,30);if(state.type===1){const board=n<=3?0:1,col=(n-1)%3;const space=[0,1,2].some(row=>!state.boards[board][row*3+col]);if(space){state.phase='place';state.message=`Saiu ${n}! Escolha uma casa vazia da coluna ${n} no tabuleiro ${board===0?'A':'B'}.`;}else{state.phase='next';state.message=`Saiu ${n}, mas a coluna já está cheia. Você perde a vez!`;if(state.dieType==='physical'){state.current=(state.current+1)%state.players.length;state.phase='roll';state.roll=null;state.message+=` Agora é a vez de ${state.players[state.current]}: informe o dado físico.`;}}}else{const p=state.current;const seen=state.marks[p][n-1];if(!seen)state.marks[p][n-1]=true;const total=state.marks[p].filter(Boolean).length;if(total===6){state.phase='won';state.winner=p;state.scores[p]=(state.scores[p]||0)+1;state.message=`${state.players[p]} completou os números de 1 a 6!`;celebrate()}else{state.phase='next';state.message=seen?`Saiu ${n}, mas ${state.players[p]} já havia marcado esse número. Sem ponto nesta vez.`:`Saiu ${n}! Número marcado para ${state.players[p]}. Agora faltam ${6-total}.`;}}render()}
function playCell(b,i){if(state.type!==1||state.phase!=='place'||state.roll===null)return;const board=state.roll<=3?0:1,col=(state.roll-1)%3;if(b!==board||i%3!==col||state.boards[b][i])return;const symbol=state.current===0?'X':'O';state.boards[b][i]=symbol;const won=lines.find(line=>line.every(idx=>state.boards[b][idx]===symbol));if(won){state.phase='won';state.winner=state.current;state.winLine={board:b,cells:won};state.scores[state.current]=(state.scores[state.current]||0)+1;state.message=`${state.players[state.current]} fez três ${symbol} em linha!`;celebrate()}else if(state.boards.every(br=>br.every(Boolean))){state.phase='won';state.winner=-1;state.message='Todos os espaços foram preenchidos. Empate!';}else{state.phase='next';state.message=`${state.players[state.current]} marcou ${symbol}. Agora é a vez do adversário.`;if(state.dieType==='physical'){state.current=(state.current+1)%state.players.length;state.phase='roll';state.roll=null;state.message=`Agora é a vez de ${state.players[state.current]} (${state.current===0?'X':'O'}). Jogue o dado físico e selecione de 1 a 6.`;}}render()}
function next(){if(state.phase!=='next')return;state.current=(state.current+1)%state.players.length;state.phase='roll';state.roll=null;state.message=`É a vez de ${state.players[state.current]}. Role o dado!`;render()}
function celebrate(){const box=$('#confetti');box.innerHTML=Array.from({length:44},(_,i)=>`<i style="--l:${(i*41)%99}%;--c:${colors[i%colors.length]};--d:${(i%7)*.08}s;--r:${i*31}deg"></i>`).join('');setTimeout(()=>{box.innerHTML=''},3200)}
function rules(){let text=state.type===1?'Cada jogador escolhe X ou O. O dado 1, 2 ou 3 permite marcar uma casa vazia da coluna correspondente no tabuleiro A. Dado 4, 5 ou 6: marque a coluna correspondente no tabuleiro B. Você pode escolher entre as três linhas daquela coluna. Se estiver cheia, perde a vez. A primeira pessoa a formar três símbolos iguais em linha horizontal, vertical ou diagonal em qualquer tabuleiro vence.':'Cada jogador tem seis números: 1, 2, 3, 4, 5 e 6. Na sua vez, role o dado. Se ainda não tiver marcado o resultado, marque-o. Se já tiver, apenas passe a vez. A primeira pessoa que completar os seis números vence.';alert((state.type===1?'VELHA DOS DADOS':'CORRIDA DO 1 AO 6')+'\n\n'+text+'\n\nDADO FÍSICO: escolha o resultado na tela após jogar um dado verdadeiro.')}
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;switch(a){case 'setup':showSetup(Number(b.dataset.type));break;case 'setup-current':state.setup=true;state.setupType=state.type;render();break;case 'home':state.page='home';state.phase='roll';state.roll=null;state.setup=false;render();break;case 'close-setup':state.setup=false;render();break;case 'die-mode':readNames();state.dieType=b.dataset.mode;render();break;case 'start':start();break;case 'new-round':resetRound();break;case 'roll':roll();break;case 'manual':applyDie(Number(b.dataset.n));break;case 'cell':playCell(Number(b.dataset.b),Number(b.dataset.i));break;case 'next':next();break;case 'rules':rules();break;}});
app.addEventListener('change',e=>{if(e.target.id==='playercount'){readNames();state.playerCount=Math.min(8,Math.max(2,Number(e.target.value)));if(state.players.length<state.playerCount){state.players.push(...Array.from({length:state.playerCount-state.players.length},(_,j)=>`Jogador ${state.players.length+j+1}`));}render();}});
render();
})();
</script>
</body>
</html>
