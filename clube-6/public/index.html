<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clube dos 6 Jogos</title><style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,Arial;background:radial-gradient(circle at top left,#244e80,#10182b 68%);color:#f4f7ff;min-height:100vh}main{max-width:1050px;margin:auto;padding:18px}h1{font-size:clamp(32px,7vw,58px);margin:14px 0}p{line-height:1.5;color:#c7d5ed}.card{background:#172a47;border:1px solid #436084;border-radius:22px;padding:22px;margin:20px 0;box-shadow:0 14px 32px #0003}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.hidden{display:none}button,input{font:inherit;border-radius:12px;padding:12px;border:0}button{background:#ffc857;font-weight:800;color:#17233b;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}input{background:#0d1c33;border:1px solid #597197;color:#fff;max-width:100%}.ghost{background:#345477;color:white}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.games button{text-align:left;min-height:76px;background:#2a4263;color:white;border:2px solid transparent}.games button.selected{border-color:#ffc857;background:#395779}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}.sq{border:1px solid #49698b;border-radius:7px;background:#1e385c;min-height:53px;padding:4px;display:flex;flex-direction:column;justify-content:space-between;font-size:12px}.pieces{font-size:18px;overflow-wrap:anywhere}.player{padding:8px 12px;background:#355372;border-radius:11px}.pill{display:inline-block;padding:8px 14px;border-radius:999px;background:#345272}#msg{color:#ffd578;min-height:22px}@media(max-width:600px){.sq{min-height:37px;font-size:10px}.pieces{font-size:13px}.card{padding:14px}}
</style></head><body><main><span class="pill">🎲 ONLINE • 2 A 8 JOGADORES</span><h1>Clube dos 6 Jogos</h1><p>Entre só com o nome. Cada amigo pode jogar de seu próprio celular, em qualquer lugar.</p>
<section id="entry" class="card"><h2>Entre no jogo</h2><div class="row"><input id="name" maxlength="24" placeholder="Seu nome"><input id="code" maxlength="6" placeholder="Código da sala"></div><div class="row" style="margin-top:12px"><button id="create">✨ Criar sala</button><button id="join" class="ghost">Entrar na sala</button></div></section>
<section id="room" class="hidden"><div class="card"><div class="row"><h2 id="roomcode"></h2><button class="ghost" id="invite">📲 Compartilhar convite</button></div><p id="status"></p><div class="row" id="players"></div></div>
<div class="card"><h2>Escolha seu jogo</h2><div id="games" class="games"></div><p>As regras desta edição online são adaptações simplificadas dos jogos antigos.</p><div class="row"><button id="start">▶ Iniciar partida</button><button id="reset" class="ghost">↻ Nova partida</button></div></div>
<div class="card"><h2 id="gametitle"></h2><h3 id="turn"></h3><div id="board" class="board"></div><div class="row" style="margin-top:18px"><button id="roll">🎲 Jogar dado</button><span id="result" class="pill"></span></div></div></section><p id="msg" role="status"></p><p>Sem cadastro, sem UNO Flip e sem Código das Cores.</p></main><script>
const games=[['triangulo','🔺 Triângulo dos Dados'],['velha','❎ Velha dos Dados'],['corrida16','🎲 Corrida do 1 ao 6'],['trilha','🛤️ Trilha com Dado'],['estrela','⭐ Corrida da Estrela'],['chegada','🏁 Corrida da Chegada']];const colors=['🔴','🔵','🟢','🟡','🟣','🟠','⚪','🟤'];const $=x=>document.getElementById(x);let ws,state,me;let q=new URLSearchParams(location.search);if(q.has('s'))$('code').value=q.get('s');
function connect(type){let name=$('name').value.trim(),code=$('code').value.trim().toUpperCase();if(!name)return $('msg').textContent='Digite seu nome';if(type==='join'&&!code)return $('msg').textContent='Digite o código da sala';if(ws)ws.close();ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>ws.send(JSON.stringify({type,name,code}));ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.error){$('msg').textContent=m.error;return}me=m.you;state=m;render();$('msg').textContent=''};ws.onclose=()=>{$('msg').textContent='Conexão encerrada. Atualize a página para entrar novamente.'};ws.onerror=()=>{$('msg').textContent='Não foi possível conectar ao servidor.'}}
function send(type,extra={}){if(ws?.readyState===1)ws.send(JSON.stringify({type,...extra}))}
$('create').onclick=()=>connect('create');$('join').onclick=()=>connect('join');$('start').onclick=()=>send('start');$('reset').onclick=()=>send('reset');$('roll').onclick=()=>send('roll');$('invite').onclick=async()=>{let url=location.origin+'/?s='+state.code;try{if(navigator.share)await navigator.share({title:'Vamos jogar?',url});else{await navigator.clipboard.writeText(url);$('msg').textContent='Convite copiado! Cole no WhatsApp.'}}catch{$('msg').textContent=url}};
function render(){let s=state,host=s.host===me;$('entry').classList.add('hidden');$('room').classList.remove('hidden');$('roomcode').textContent='Sala '+s.code;$('status').textContent=s.winner?'🏆 Vencedor: '+s.winner:s.started?'Partida em andamento':'Aguardando jogadores';$('players').replaceChildren();s.players.forEach((p,i)=>{let e=document.createElement('span');e.className='player';e.textContent=colors[i]+' '+p.name+(p.id===s.host?' 👑':'');$('players').appendChild(e)});$('games').replaceChildren();games.forEach(([id,title])=>{let b=document.createElement('button');b.textContent=title;b.className=s.game[0]===id?'selected':'';b.disabled=!host||s.started;b.onclick=()=>send('game',{game:id});$('games').appendChild(b)});$('start').disabled=!host||s.started||s.players.length<2;$('reset').disabled=!host;$('gametitle').textContent=games.find(x=>x[0]===s.game[0])?.[1]||s.game[1];$('turn').textContent=s.winner?'🏆 Parabéns, '+s.winner+'!':s.started?'Vez de '+(s.players[s.turn]?.name||''):'Escolha o jogo e aguarde o início.';$('roll').disabled=!s.started||s.players[s.turn]?.id!==me;$('result').textContent=s.roll||'Dado aguardando';$('board').replaceChildren();for(let i=0;i<=s.game[2];i++){let e=document.createElement('div');e.className='sq';let n=document.createElement('span');n.textContent=i===0?'INÍCIO':i===s.game[2]?'🏆 FIM':i;let pieces=document.createElement('span');pieces.className='pieces';pieces.textContent=s.players.map((p,j)=>p.pos===i?colors[j]:'').join('');e.append(n,pieces);$('board').appendChild(e)}}
</script></body></html>
